[project]
name = "used-car-advisor"
version = "0.1.0"
description = "Voice agent that helps visitors find a suitable used car"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "fastmcp>=2.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "livekit-agents[mcp,openai,tavus]>=1.6",
    "aiohttp>=3.10",
    "livekit-api>=1.0",
    "pandas>=3.0.5",
    "tabulate>=0.9",  # pandas.DataFrame.to_markdown needs it
]

[project.scripts]
used-car-advisor = "used_car_advisor.agent:main"
used-car-advisor-web = "used_car_advisor.web:main"
used-car-advisor-mcp = "cars_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cars_db", "src/cars_leasing", "src/cars_mailer", "src/cars_mcp", "src/used_car_advisor"]

[tool.uv]
dev-dependencies = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.1",
    "pyarrow>=25.0.0",
    "pytest>=8.0",
    "ruff>=0.16.1",
]
